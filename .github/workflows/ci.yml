name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # CommentKit is a Windows app: the video cards use Windows fonts and the window is Edge in app mode.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -q
